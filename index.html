<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Файлообменник - CloudShare</title>
</head>
<body>
    <header class="site-header">
        <div class="logo">CloudShare</div>
        <div id="auth-block"></div>
    </header>

    <main>
        <div class="container"> 
            <!-- Блок, который видят только авторизованные -->
            <div id="upload-section" style="display: none;">
                <h1>Загрузка файлов</h1>
                <label for="files">Выберите файлы:</label>
                <input type="file" id="files" name="file" required>
                <button id="uploadBtn">Загрузить</button>
            </div>

            <!-- Блок с приветствием для гостей -->
            <div id="guest-section" style="text-align: center; padding: 20px;">
                <h1>Добро пожаловать!</h1>
                <p style="margin: 20px 0; color: #555;">Чтобы загружать и хранить файлы, войдите в аккаунт.</p>
                <a href="login.html" class="btn-register" style="display: inline-block; text-decoration: none; padding: 14px 32px; border-radius: 8px; background: #e789ff; color: white; font-weight: bold;">Войти в аккаунт</a>
            </div>

            <!-- Список файлов -->
            <div id="fileList" style="margin-top: 20px;"></div>
        </div> 
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Курсовая работа. Все права защищены.</p>
    </footer>

    <!-- Модальное окно личного кабинета (без иконки) -->
    <div id="profileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; width: 300px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <span id="closeModal" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #333;">&times;</span>
            
            <h2 style="color: #2b2d42; margin-bottom: 15px;">Личный кабинет</h2>
            <p style="color: #666; margin-bottom: 15px;">Вы вошли как: <br><strong id="modalUsername" style="color: #e789ff; font-size: 22px;"></strong></p>
            
            <button id="modalLogoutBtn" style="margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2b2d42; color: white; cursor: pointer; font-weight: bold; transition: 0.2s;">Выйти из аккаунта</button>
        </div>
    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
